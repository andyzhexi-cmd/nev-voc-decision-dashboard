# -------------------------------------------------------------
# 一致性审计项（论文内部/实现与论文之间已知的口径冲突）
# 系统在"审计面板"中实时运行这些核查并展示偏差，不掩盖、不静默修正
#
# 每条字段含义：
#   root_cause   取证结论（含关键数字，直接作为面板「根因」文案）
#   repair_label 修复动作短名（面板开关标签）
#   repair_effect修复后效果（一句话，含修复后数字）
#   status_after 修复开启后的状态：pass / resolved / warn
#   before/after 修复前后偏差数字（论文原值必须保留在 before 中可见）
# -------------------------------------------------------------
audit_findings:
  - id: AHP_WEIGHT_MISMATCH
    severity: high
    title: "AHP 判断矩阵无法推出论文权重"
    detail: "表5.7 矩阵按方根法/特征向量法计算得 (0.6424, 0.0724, 0.2852)，CR=0.3259；论文表5.8 为 (0.434, 0.187, 0.379)，CR=0.0846"
    root_cause: |
      表5.7 与表5.8 内部不自洽，穷举标准标度无解：对 {1/9…9} 标度的全部 17³=4913 个
      3×3 互反矩阵穷举，无一能同时复现论文权重（容差 0.004）与 CR=0.0846（容差 0.002），
      最小权重偏差 0.0071、最小 CR 偏差 0.0021；6 种行列排列 × 转置假设共 12 种也全部不匹配。
      论文矩阵按方根法得 (0.6424, 0.0724, 0.2852)、CR=0.3259，与表5.8 的
      (0.434, 0.187, 0.379)、CR=0.0846 最大偏差 0.2084 —— 差异来自论文数据本身，非算法实现。
    repair_label: "反推一致性矩阵"
    repair_effect: "按论文权重反推完全一致性矩阵 a_ij = w_i/w_j，方根法精确还原 (0.434, 0.187, 0.379)、CR=0，最大偏差 0.0000，100% 复现表5.8"
    status_after: "resolved"
    before:
      计算权重: [0.6424, 0.0724, 0.2852]
      论文权重: [0.434, 0.187, 0.379]
      最大偏差: 0.2084
      计算CR: 0.3259
      论文CR: 0.0846
      穷举矩阵数: 4913
      权重容差: 0.004
      CR容差: 0.002
      同时命中数: 0
      排列转置假设数: 12
      命中假设数: 0
      最小权重偏差: 0.0071
      最小CR偏差: 0.0021
    after:
      重建方式: "a_ij = w_i / w_j（按论文表5.8 权重反推）"
      方根法还原权重: [0.434, 0.187, 0.379]
      最大偏差: 0.0
      CR: 0.0
      λmax: 3.0
      复现率: "100%（表5.8）"
  - id: DEMATEL_WEIGHT_MISMATCH
    severity: high
    title: "DEMATEL 一级权重与论文表5.11 不符"
    detail: "表5.9 矩阵计算得 (0.286, 0.355, 0.359)，论文为 (0.516, 0.204, 0.280)"
    root_cause: |
      自顶向下（表5.9 → T 矩阵 → 中心度/原因度合成 → 按组聚合）得一级权重
      (0.286, 0.355, 0.359)，论文表5.11 为 (0.516, 0.204, 0.280)，最大偏差 0.2300。
      根因已找到：论文一级权重 = 论文二级权重（表5.10）按组自底向上求和，实测 dev = 0.0000（完全相等）。
      附带事实：表5.10 的二级权重本身无法由表5.9 复算（12 维上最佳变体 |D−R| 归一，maxdev=0.0721）。
    repair_label: "自底向上聚合（论文口径）"
    repair_effect: "一级权重聚合口径增加 bottom_up（表5.10 二级权重按组求和归一），校准模式默认启用，精确复现表5.11 (0.516, 0.204, 0.280)，dev=0.0000"
    status_after: "resolved"
    before:
      自顶向下一级权重: [0.286, 0.355, 0.359]
      论文表5.11: [0.516, 0.204, 0.28]
      最大偏差: 0.23
      二级权重复算最大偏差: 0.0721
    after:
      自底向上一级权重: [0.516, 0.204, 0.28]
      最大偏差: 0.0
      聚合口径: "bottom_up（表5.10 二级权重按组求和归一）"
      论文一级权重来源: "表5.10 按组自底向上求和（dev=0.0000）"
  - id: DEMATEL_L5
    severity: medium
    title: "表5.9 含 l5 级，超出论文定义的 L={l0..l4}"
    detail: "c14→c12 与 c21→c31 两处为 l5；原实现静默记为 l4，本系统按论文原值录入并标注"
    root_cause: |
      论文表5.9 原始录入含 2 处 l5（c14→c12、c21→c31），而 §4.2.2 定义的语集为 L={l0..l4}；
      属论文数据本身的标度越级，无法由算法口径解释或修复，只能原值保留并标注。
    repair_label: "如实标注（不做静默修正）"
    repair_effect: "按论文原值录入并标注越级格子数=2，取代旧实现静默降级为 l4 的做法"
    status_after: "warn"
    before:
      越级格子数: 2
      定义语集: "l0..l4"
