# =============================================================
# baselines.yaml — 论文基准口径唯一真源（Single Source of Truth）
# 来源：硕士论文《融合情感分析与PLTS-VIKOR的新能源汽车产品改进多属性决策研究》
#       表 4.2 / 5.3 / 5.5 / 5.7-5.20，图 3.5 / 5.6 / 5.7 / 5.10
# 用途：校准模式下的对照值 + 一致性审计（consistency audit）输入
# =============================================================

meta:
  paper_title: "融合情感分析与PLTS-VIKOR的新能源汽车产品改进多属性决策研究"
  thesis: "上海理工大学硕士学位论文"
  attributes: [外观, 内饰, 空间, 续航, 性价比, 舒适性]        # A1..A6
  attribute_codes: [A1, A2, A3, A4, A5, A6]
  first_level: [期望值C1, 敏感值C2, 吸引值C3]
  second_level: [c11, c12, c13, c14, c21, c22, c23, c24, c31, c32, c33, c34]
  second_level_names:
    c11: 性能期望值
    c12: 价格期望值
    c13: 续航期望值
    c14: 整体期望值
    c21: 价格敏感值
    c22: 外观敏感值
    c23: 品牌敏感值
    c24: 整体敏感值
    c31: 价格吸引值
    c32: 品牌吸引值
    c33: 性能吸引值
    c34: 整体吸引值
  group_of: {c11: C1, c12: C1, c13: C1, c14: C1, c21: C2, c22: C2, c23: C2, c24: C2,
             c31: C3, c32: C3, c33: C3, c34: C3}

# 语言术语集：论文 §4.1 / §5.5  L={l0..l4}
linguistic_scale:
  terms: [l0, l1, l2, l3, l4]
  values: [1, 2, 3, 4, 5]          # 期望得分映射（李克特 1-5）
  labels: {l0: 非常差, l1: 差, l2: 一般, l3: 好, l4: 非常好}

# 表 4.1 / 4.2
ahp:
  matrix: [[1, 5, 4], [0.2, 1, 0.14285714285714285], [0.25, 7, 1]]   # 表5.7
  weights: [0.434, 0.187, 0.379]                                     # 表5.8
  lambda_max: 3.1693        # 由 CR=0.0846 反推（论文未直接给出 λmax）
  CR: 0.0846
  RI: {1: 0, 2: 0, 3: 0.52, 4: 0.89, 5: 1.12, 6: 1.24, 7: 1.36, 8: 1.41, 9: 1.46, 10: 1.49}

# 表 5.9 专家组直接关联矩阵（论文原值，含 2 处 l5）
dematel:
  scale: [l0, l1, l2, l3, l4, l5]                # 注意：论文正文仅定义 l0..l4，表5.9 出现 l5
  sub_weights: {c11: 0.189, c12: 0.067, c13: 0.153, c14: 0.107,
                c21: 0.051, c22: 0.106, c23: 0.016, c24: 0.031,
                c31: 0.077, c32: 0.085, c33: 0.039, c34: 0.079}     # 表5.10
  first_weights: [0.516, 0.204, 0.280]                               # 表5.11
  # 表5.9 原始矩阵（行=影响方，列=受影响方），元素为 l0..l5
  Z:
    - [l0, l1, l1, l1, l3, l4, l4, l4, l3, l4, l4, l3]
    - [l0, l0, l0, l0, l1, l2, l2, l3, l1, l1, l2, l3]
    - [l1, l2, l0, l3, l1, l1, l1, l2, l1, l2, l2, l3]
    - [l1, l5, l1, l0, l2, l1, l1, l4, l1, l2, l3, l4]   # 论文原值 l5（原实现记为 l4）
    - [l0, l0, l1, l1, l0, l3, l3, l4, l5, l2, l3, l4]    # 论文原值 l5（原实现记为 l4）
    - [l0, l1, l0, l0, l3, l0, l4, l0, l0, l1, l3, l2]
    - [l0, l2, l0, l0, l1, l3, l0, l2, l1, l2, l2, l1]
    - [l0, l3, l0, l0, l4, l3, l3, l0, l4, l3, l3, l3]
    - [l0, l1, l0, l0, l1, l2, l2, l2, l0, l3, l3, l2]
    - [l1, l1, l0, l0, l1, l1, l2, l4, l4, l0, l3, l3]
    - [l0, l1, l0, l0, l1, l1, l1, l2, l2, l0, l0, l4]
    - [l0, l1, l0, l0, l1, l1, l1, l2, l2, l4, l0, l0]

# 式(4.7) 综合权重
combined_weights:
  lambda: 0.5
  wA: [0.434, 0.187, 0.379]
  wD: [0.516, 0.204, 0.280]
  w:  [0.475, 0.196, 0.329]      # 表5.12

