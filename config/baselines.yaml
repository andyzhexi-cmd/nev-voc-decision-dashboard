# -------------------------------------------------------------
# 一致性审计项（论文内部/实现与论文之间已知的口径冲突）
# 系统在"审计面板"中实时运行这些核查并展示偏差，不掩盖、不静默修正
# -------------------------------------------------------------
audit_findings:
  - id: AHP_WEIGHT_MISMATCH
    severity: high
    title: "AHP 判断矩阵无法推出论文权重"
    detail: "表5.7 矩阵按方根法/特征向量法计算得 (0.6424, 0.0724, 0.2852)，CR=0.3259；论文表5.8 为 (0.434, 0.187, 0.379)，CR=0.0846"
  - id: DEMATEL_WEIGHT_MISMATCH
    severity: high
    title: "DEMATEL 一级权重与论文表5.11 不符"
    detail: "表5.9 矩阵计算得 (0.286, 0.355, 0.359)，论文为 (0.516, 0.204, 0.280)"
  - id: DEMATEL_L5
    severity: medium
    title: "表5.9 含 l5 级，超出论文定义的 L={l0..l4}"
    detail: "c14→c12 与 c21→c31 两处为 l5；原实现静默记为 l4，本系统按论文原值录入并标注"
  - id: Q_NOT_DERIVABLE_FROM_S_R
    severity: high
    title: "表5.17 的 Q 无法由表5.16 的 S/R 与式(4.11) 推出"
    detail: "A1 同时取到 S 与 R 的最小值，按式(4.11) 必有 Q=0，论文给出 0.0763；A4 的 S/R 偏低但 Q=0.8564 显著背离"
  - id: SENSITIVITY_VS_RESULT
    severity: medium
    title: "表5.18 在 λ=0.5 处与表5.17 结果不一致"
    detail: "如内饰 2.5509 vs 1.7604、性价比 4.2459 vs 3.4675"
  - id: ISA_SATISFACTION_CONFLICT
    severity: medium
    title: "ISA 续航满意度两套口径"
    detail: "表5.20 为 4.1，图5.10 与正文判为改进区（低满意度，对应 2.8）"
